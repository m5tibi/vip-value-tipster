<script>
// Safety fallback
if(typeof window.t!=="function"){window.t=function(k,fb){return fb||k.split(".").pop();};window.getLang=function(){return"hu";};window.setLang=function(){};window.toggleLang=function(){};}
// ── Biztonságos localStorage ──────────────────────────────
var KS='vbt_ck', HS='vbt_ah3';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsRemove(k){try{localStorage.removeItem(k);}catch(e){}}

// ── Állapot ───────────────────────────────────────────────
var S={
  screen:'loading', tab:'analyzer',
  claudeKey:'', keyIn:'', savingKey:false, keyMsg:null,
  query:'', loading:false, result:null,
  history:[], expanded:null
};

var EXAMPLES=[
  'Brazilia - Norvegia',
  'Belgium - Szenegal; mindket csapat szerez golt + Over 2.5',
  'Brazilia - Argentina; hazai gyozelem',
  'Real Madrid - Barcelona; Over 3.5 gol'
];

// ── Segédfüggvények ───────────────────────────────────────
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function mk(k){return k.slice(0,14)+'................'+k.slice(-4);}

function simpleHash(s){
  var h=0;
  for(var i=0;i<s.length;i++){h=Math.imul(31,h)+s.charCodeAt(i)|0;}
  return Math.abs(h).toString(36);
}

function getUid(){return S.claudeKey?simpleHash(S.claudeKey):'';}

function tabSt(name){
  var a=S.tab===name;
  return 'style="padding:8px 15px;font-size:13px;font-weight:600;border:none;'+
    'border-radius:8px 8px 0 0;cursor:pointer;'+
    'background:'+(a?'#1e2130':'transparent')+';'+
    'color:'+(a?'#a78bfa':'#6b7280')+'"';
}

// ── AI szöveg renderelő ───────────────────────────────────
function renderAI(text){
  if(!text) return '';
  // Szekciófejlécek azonosítása (emoji prefixek)
  var HEADS=['MECCS','HAZAI','VENDEG','H2H','SERULES','FOGADASI','KONTEXTUS','FORMA','ELOZMENYEK','ERTEKELES'];
  var lines=text.split('\n');
  var out='';
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line.trim()){out+='<br>';continue;}
    // Elválasztó vonalak kihagyása
    if(/^[-=]{3,}$/.test(line.trim())){continue;}
    // Szekciófejléc detektálása: nagybetűs kulcsszóra végződő sor
    var safe=esc(line);
    var upper=line.toUpperCase();
    var isHead=false;
    for(var j=0;j<HEADS.length;j++){
      if(upper.indexOf(HEADS[j])!==-1 && line.trim().length<80 &&
        (line.indexOf(':')===line.length-1 || /^[^\w]/.test(line))){
        isHead=true; break;
      }
    }
    // Markdown bold kezelése
    var fmt=safe.replace(/\*\*([^*]+)\*\*/g,'<strong style="color:#e2e8f0">$1</strong>');
    if(isHead){
      out+='<div class="sec-hdr">'+fmt+'</div>';
    } else {
      out+='<div style="margin-bottom:4px">'+fmt+'</div>';
    }
  }
  return out;
}

// ── Verdikt kinyerése ─────────────────────────────────────
function getVerdict(ai){
  if(!ai) return null;
  var m=ai.match(/VERDIKT\s*:\s*([\u2705\u26A0\u274C][^\n\r]*)/);
  if(m) return m[1].trim();
  if(ai.indexOf('AJANLOTT')!==-1||ai.indexOf('AJÁNLOTT')!==-1) return '\u2705 AJÁNLOTT';
  if(ai.indexOf('BIZONYTALAN')!==-1) return '\u26A0\uFE0F BIZONYTALAN';
  if(ai.indexOf('NEM AJANLOTT')!==-1||ai.indexOf('NEM AJÁNLOTT')!==-1) return '\u274C NEM AJÁNLOTT';
  return null;
}

function verdictStyle(v){
  if(!v) return '';
  if(v.indexOf('\u2705')!==-1) return 'background:#4ade8018;border:2px solid #4ade8055;color:#4ade80';
  if(v.indexOf('\u274C')!==-1) return 'background:#f8717118;border:2px solid #f8717155;color:#f87171';
  return 'background:#fbbf2418;border:2px solid #fbbf2455;color:#fbbf24';
}

function stripVerdict(ai){
  return ai.replace(/\n*VERDIKT\s*:.*$/,'').trim();
}

// ── Render ────────────────────────────────────────────────
function R(){
  try{
    var howItWorks=
    '<div class="card" style="border-color:#1e2130;margin-bottom:14px">'+
    '<div style="font-size:13px;font-weight:700;color:#a78bfa;margin-bottom:10px">'+window.t('analyzer.how_title')+'</div>'+
    '<div style="font-size:13px;color:#6b7280;line-height:1.7">'+
    ''+window.t('analyzer.how_body')+'<br><br>'+
    '<strong style="color:#94a3b8">'+window.t('analyzer.how_format')+'</strong> '+window.t('analyzer.team_example')+' '+window.t('analyzer.how_option')+'<br>'+
    '<span style="color:#4b5563">'+window.t('analyzer.how_example')+'</span>'+
    '</div></div>';

    var html=howItWorks+(S.screen==='onboarding'?rOnboard():rApp());
    document.getElementById('root').innerHTML=html;
  }catch(e){
    document.getElementById('root').innerHTML='<div style="padding:20px;color:#f87171">Hiba: '+esc(String(e))+'</div>';
  }
}

// ── localStorage sync ─────────────────────────────────────
function boot(){
  try{
    var k=lsGet(KS);
    var h=lsGet(HS);
    if(k) S.claudeKey=k;
    if(h) S.history=JSON.parse(h)||[];
  }catch(e){}
  S.screen=S.claudeKey?'app':'onboarding';
  R();
  if(S.claudeKey) syncHistory();
}
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',boot);
else boot();

function syncHistory(){
  var uid=getUid();
  if(!uid) return;
  fetch('/api/analyzer-history?uid='+uid)
    .then(function(r){return r.json();})
    .then(function(d){
      if(Array.isArray(d)&&d.length){
        S.history=d;
        lsSet(HS,JSON.stringify(d));
        R();
      }
    }).catch(function(){});
}

function saveEntry(entry){
  var uid=getUid();
  if(!uid) return;
  fetch('/api/analyzer-history',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid:uid,entry:entry})
  }).catch(function(){});
}

function clearServerHistory(){
  var uid=getUid();
  if(!uid) return;
  fetch('/api/analyzer-history?uid='+uid,{method:'DELETE'}).catch(function(){});
}

// ── API kulcs ─────────────────────────────────────────────
function saveKey(){
  if(!S.keyIn.trim()){S.keyMsg='error';R();return;}
  S.savingKey=true;S.keyMsg=null;R();
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':S.keyIn,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:10,messages:[{role:'user',content:'Hi'}]})
  }).then(function(r){
    if(r.ok){
      lsSet(KS,S.keyIn);
      S.claudeKey=S.keyIn;
      S.keyIn='';
      S.savingKey=false;
      S.screen='app';
      R();
      syncHistory();
    } else {
      S.keyMsg='error';
      S.savingKey=false;
      R();
    }
  }).catch(function(){ S.keyMsg='error'; S.savingKey=false; R(); });
}

function delKey(){lsRemove(KS);S.claudeKey='';S.keyIn='';S.keyMsg=null;S.screen='onboarding';R();}

// ── Példa betöltése ───────────────────────────────────────
function setEx(idx){
  S.query=EXAMPLES[idx];
  R();
  setTimeout(function(){
    var el=document.getElementById('qi');
    if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}
  },50);
}

// ── Elemzés ───────────────────────────────────────────────
function analyze(){
  if(!S.claudeKey){alert(window.t('analyzer.no_key_alert'));return;}
  if(S.loading) return;
  var q=(S.query||'').trim();
  if(!q){alert(window.t('analyzer.no_match_alert'));return;}
  S.loading=true;S.result=null;R();

  // Háttér-kontextus: főoldali tippek lekérése (NEM jelenik meg az elemzésben)
  fetch('/api/tips').then(function(r){return r.json();}).catch(function(){return {valueTips:[],aiTips:[]};})
  .then(function(td){
    var allTips=(td.aiTips||[]);
    var hiddenCtx='';
    if(allTips.length){
      hiddenCtx='\n\n[BELSŐ HÁTTÉR-KONTEXTUS — NEM JELENIK MEG AZ ELEMZÉSBEN, NE HIVATKOZZ RÁ]\n'+
        'Az alábbi tippek más forrásból már ki lettek dolgozva erre a napra. Az elemzésedben SOHA ne utalj arra, hogy "más tipp", "főoldal", "rendszer" vagy bármilyen külső forrás ezeket ajánlja. Ezeket csak saját konzisztencia-ellenőrzésre használd — ha az elemzésed más következtetésre jut, azt a te saját adatelemzésed alapján tedd, hivatkozás nélkül.\n';
      for(var i=0;i<allTips.length;i++){
        var t=allTips[i];
        hiddenCtx+='- '+t.match+': '+t.market+' → '+t.pick+' @ '+t.odds+'\n';
      }
      hiddenCtx+='[/BELSŐ HÁTTÉR-KONTEXTUS]\n';
    }

    var isEN = window.getLang && window.getLang() === 'en';
    var prompt = isEN ? (
      'You are a professional football betting analyst for paying subscribers.\n\n'+
      'STYLE: Write exclusively in correct, professional English. Be concise — only claims backed by numbers. Never reference other sources.\n\n'+
      'IMPORTANT: If you cannot identify a football match, write: NOT UNDERSTOOD: [explanation]\n\n'+
      'User request:\n"'+q+'"\n'+hiddenCtx+'\n\n'+
      'Use web search for real data. Two cases:\n\n'+
      '=== (A) SPECIFIC BETTING OPTION IN REQUEST ===\n'+
      'Evaluate it in this exact structure:\n'+
      'MATCH CONTEXT:\n[Tournament, round — 1-2 sentences]\n\n'+
      'HOME TEAM FORM:\n[Last 5 matches with results/dates, goals average]\n\n'+
      'AWAY TEAM FORM:\n[Last 5 matches with results/dates, goals average]\n\n'+
      'H2H HISTORY:\n[Last 3-5 meetings, goals avg, trends]\n\n'+
      'INJURIES / ABSENCES:\n[Key players both teams]\n\n'+
      'BETTING OPTION EVALUATION:\n[Detailed analysis with numbers — 5-6 sentences]\n\n'+
      'VERDICT: RECOMMENDED — [reason]\nor: VERDICT: UNCERTAIN — [reason]\nor: VERDICT: NOT RECOMMENDED — [reason]\n\n'+
      '=== (B) MATCH ONLY, NO BETTING OPTION ===\n'+
      'Full analysis + 4-5 tip suggestions:\n'+
      'MATCH CONTEXT / HOME TEAM FORM / AWAY TEAM FORM / H2H HISTORY / INJURIES / TIP SUGGESTIONS\n'+
      'Each tip: [Market] — Confidence: HIGH/MEDIUM/LOW\n   Reasoning: [2-3 sentences with numbers]\n\n'+
      'Rules: no * or # formatting. Real verified numbers only. Professional English.'
    ) : (
      'Te egy profi labdarúgás-fogadási elemző vagy, aki fizetős előfizetők számára készít elemzéseket.\n\n'+
      'STÍLUS: Kizárólag helyes, igényes magyar nyelven írj. Légy tömör és konkrét. Csak számokkal alátámasztott állításokat tégy. Soha ne utalj más forrásra.\n\n'+
      'FONTOS: Ha nem tudsz labdarúgó meccset azonosítani, írd pontosan: NEM ÉRTEM: [magyarázat]\n\n'+
      'A felhasználó kérése:\n"'+q+'"\n'+hiddenCtx+'\n\n'+
      'Használj web keresést a valós, aktuális adatokhoz. Két eset lehetséges:\n\n'+
      '=== (A) HA A KÉRÉS KONKRÉT FOGADÁSI OPCIÓT IS TARTALMAZ ===\n'+
      'PONTOSAN ebben a struktúrában:\n'+
      'MECCS KONTEXTUS:\n[Torna, forduló — 1-2 mondat]\n\n'+
      'HAZAI CSAPAT FORMA:\n[Utolsó 5 meccs eredményekkel és dátummal, gólátlag]\n\n'+
      'VENDÉG CSAPAT FORMA:\n[Utolsó 5 meccs eredményekkel és dátummal, gólátlag]\n\n'+
      'H2H ELŐZMÉNYEK:\n[Utolsó 3-5 találkozó, gólátlag, trendek]\n\n'+
      'SÉRÜLÉSEK / HIÁNYZÓK:\n[Kulcsjátékosok mindkét csapatnál]\n\n'+
      'FOGADÁSI OPCIÓ ÉRTÉKELÉSE:\n[Részletes elemzés konkrét számokkal — 5-6 mondat]\n\n'+
      'VERDIKT: AJANLOTT — [ok]\nvagy: VERDIKT: BIZONYTALAN — [ok]\nvagy: VERDIKT: NEM AJANLOTT — [ok]\n\n'+
      '=== (B) HA A KÉRÉS CSAK EGY MECCSET TARTALMAZ ===\n'+
      'Teljes elemzés + 4-5 tipp-javaslat:\n'+
      'MECCS KONTEXTUS / HAZAI CSAPAT FORMA / VENDÉG CSAPAT FORMA / H2H ELŐZMÉNYEK / SÉRÜLÉSEK / TIPP JAVASLATOK\n'+
      'Minden javaslat: [Piac és tipp] — Megbízhatóság: MAGAS/KÖZEPES/ALACSONY\n   Indoklás: [2-3 mondat konkrét számokkal]\n\n'+
      'Szabályok: ne használj csillag (*) vagy hashtag (#) formázást. Adj valódi, ellenőrzött számokat. Kizárólag helyes, igényes magyar nyelvezet.'
    );

    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.claudeKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:6000,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:prompt}]
      })
    }).then(function(r){return r.json();})
    .then(function(d){
      var texts=[];
      if(d.content){for(var i=0;i<d.content.length;i++){if(d.content[i].type==='text')texts.push(d.content[i].text);}}
      var ai=texts.length?texts.map(function(s){return (s||'').trim();}).filter(Boolean).join('\n\n'):window.t('analyzer.analysis_failed');
      ai=ai.replace(/VERDIKT\s*:\s*AJANLOTT/gi,'VERDIKT: \u2705 AJÁNLOTT')
           .replace(/VERDIKT\s*:\s*NEM AJANLOTT/gi,'VERDIKT: \u274C NEM AJÁNLOTT')
           .replace(/VERDIKT\s*:\s*BIZONYTALAN/gi,'VERDIKT: \u26A0\uFE0F BIZONYTALAN')
           .replace(/VERDIKT\s*:\s*AJ\u00C1NLOTT/gi,'VERDIKT: \u2705 AJÁNLOTT')
           .replace(/VERDIKT\s*:\s*NEM AJ\u00C1NLOTT/gi,'VERDIKT: \u274C NEM AJÁNLOTT');
      var unclear=ai.indexOf('NEM ÉRTEM:')!==-1||ai.indexOf('NEM ERTEM:')!==-1;
      var entry={id:Date.now(),ts:new Date().toLocaleString('hu-HU'),query:q,ai:ai,unclear:unclear};
      S.result=entry;
      if(!unclear){
        S.history=[entry].concat(S.history).slice(0,50);
        lsSet(HS,JSON.stringify(S.history));
        saveEntry(entry);
      }
      S.loading=false;R();
    }).catch(function(e){
      S.result={error:true,msg:'Hiba: '+String(e)};
      S.loading=false;R();
    });
  });
}

        '<div style="font-size:13px;color:#cbd5e1;padding-top:4px">'+steps[i][1]+'</div></div>';

  return rHdr()+
    '<div class="ob">'+
    '<div class="card" style="border-color:#7c3aed44;margin-bottom:16px">'+
    '<div style="font-size:16px;font-weight:700;margin-bottom:8px">'+window.t('analyzer.welcome_title')+'</div>'+
    '<div style="font-size:14px;color:#94a3b8;line-height:1.65">'+window.t('analyzer.welcome_body')+'</div></div>'+
    '<div class="card" style="margin-bottom:16px">'+
    '<div style="font-size:12px;font-weight:700;color:#a78bfa;margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px">'+window.t('analyzer.api_key_howto')+'</div>'+
    sh+'</div>'+
    '<div class="card">'+
    '<label class="lbl">'+window.t('analyzer.key_label')+'</label>'+
    '<div class="pwrap"><input id="ob-key" class="inp imono" type="password" placeholder="sk-ant-api03-..." oninput="S.keyIn=this.value;S.keyMsg=null">'+
    '<button class="ptgl" onclick="pwt(\'ob-key\',this)">&#128065;</button></div>'+
    (S.keyMsg==='ok'?'<div style="margin-top:8px;font-size:12px;color:#4ade80">'+window.t('analyzer.key_valid')+'</div>':'')+
    (S.keyMsg==='error'?'<div style="margin-top:8px;font-size:12px;color:#f87171">Érvénytelen kulcs.</div>':'')+
    '<button class="btn bfull btn-p" style="margin-top:14px" onclick="saveKey()">'+
    (S.savingKey?window.t('analyzer.key_testing'):window.t('analyzer.key_test_btn'))+'</button>'+
    '<div style="margin-top:12px;font-size:11px;color:#4b5563;text-align:center;line-height:1.5">'+
    'Csak a böngésződben tárolódik. '+window.t('analyzer.key_note')+'</div>'+
    '</div></div>';
}

function rAnalyzer(){
  var canGo=!!S.claudeKey&&!S.loading;
  var exBtns='';
  for(var i=0;i<EXAMPLES.length;i++){
    exBtns+='<button class="ex-btn" onclick="setEx('+i+')">'+esc(EXAMPLES[i])+'</button>';
  }
  var html=
    '<div class="card" style="border-color:#7c3aed33">'+
    '<label class="lbl">'+window.t('analyzer.match_label')+'</label>'+
    '<textarea id="qi" class="tarea" placeholder="'+window.t('analyzer.match_ph')+'" oninput="S.query=this.value">'+esc(S.query)+'</textarea>'+
    '<div style="margin-top:10px"><div style="font-size:11px;color:#4b5563;margin-bottom:6px">'+window.t('analyzer.examples_label')+'</div>'+exBtns+'</div>'+
    '</div>'+
    (!S.claudeKey?'<div class="card" style="border-color:#fbbf2433;color:#fbbf24;font-size:13px;text-align:center;margin-bottom:14px">'+
    'API kulcs hiányzik — add meg a '+window.t('analyzer.no_api_key')+'</div>':'')+
    '<button class="btn bfull '+(canGo?'btn-p':'btn-off')+'" onclick="analyze()">'+
    (S.loading?window.t('analyzer.analyzing'):window.t('analyzer.analyze_btn'))+'</button>'+
    '<div style="margin-top:8px;font-size:11px;color:#374151;text-align:center">'+
    'Egy elemzés kb. 40-50 Ft (~$0.10-0.15) '+window.t('analyzer.cost_note')+'</div>';

  if(S.result&&S.result.unclear){
    html+='<div class="card" style="margin-top:14px;border-color:#fbbf2433">'+
      '<div style="font-size:13px;font-weight:700;color:#fbbf24;margin-bottom:8px">Nem értem a kérést</div>'+
      '<div style="font-size:13px;color:#94a3b8;line-height:1.7">'+esc(S.result.ai.replace(/NEM \u00C9RTEM:/gi,'').replace(/NEM ERTEM:/gi,'').trim())+'</div>'+
      '</div>';
  }
  if(S.result&&!S.result.error&&!S.result.unclear){
    var r=S.result;
    var v=getVerdict(r.ai);
    var body=stripVerdict(r.ai);
    html+='<div class="card" style="margin-top:16px;border-color:#a78bfa33">'+
      '<div style="font-size:15px;font-weight:700;color:#e2e8f0;margin-bottom:4px">'+esc(r.query)+'</div>'+
      '<div style="font-size:12px;color:#6b7280;margin-bottom:14px">'+r.ts+'</div>'+
      '<div class="div">'+
      '<div style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">'+window.t('analyzer.ai_label')+'</div>'+
      '<div class="aitext">'+renderAI(body)+'</div>'+
      (v?'<div class="verdict-box" style="'+verdictStyle(v)+'">'+esc(v)+'</div>':'')+
      '</div></div>';
  }
  if(S.result&&S.result.error){
    html+='<div class="card" style="margin-top:14px;border-color:#f8717133;color:#f87171;font-size:14px">'+
      esc(S.result.msg||'Hiba az elemzés során.')+'</div>';
  }
  return html;
}

function rHistory(){
  if(!S.history.length){
    return '<div style="text-align:center;color:#6b7280;padding:50px 20px;font-size:14px">'+window.t('analyzer.no_history')+'</div>';
  }
  var html='<button class="btn btn-del bsm" style="margin-bottom:14px" '+
    'onclick="if(confirm(\'Törölni az összes előzményt?\')){S.history=[];lsRemove(\''+HS+'\');clearServerHistory();R()}">'+
    'Előzmények törlése</button>';
  for(var i=0;i<S.history.length;i++){
    var h=S.history[i];
    var isExp=S.expanded===i;
    var v=getVerdict(h.ai||'');
    var title=h.query||(h.match?(h.match+(h.tip?' — '+h.tip:'')):'Elemzés');
    var vhtml=v?'<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;'+verdictStyle(v)+'">'+esc(v)+'</span>':'';
    html+='<div class="card" style="cursor:pointer;border-color:'+(isExp?'#a78bfa44':'#1e2130')+'" onclick="S.expanded=S.expanded==='+i+'?null:'+i+';R()">'+
      '<div class="fbw">'+
      '<div><div style="font-size:14px;font-weight:600;color:#e2e8f0">'+esc(title)+'</div>'+
      '<div style="font-size:12px;color:#6b7280;margin-top:2px">'+esc(h.ts||'')+'</div></div>'+
      vhtml+'</div>'+
      (isExp&&h.ai?'<div class="div" style="margin-top:10px"><div class="aitext" style="font-size:13px">'+renderAI(stripVerdict(h.ai))+'</div>'+
      (v?'<div class="verdict-box" style="margin-top:12px;'+verdictStyle(v)+'">'+esc(v)+'</div>':'')+
      '</div>':'')+
      '</div>';
  }
  return html;
}

function rSettings(){
  return '<div class="card" style="border-color:'+(S.claudeKey?'#4ade8033':'#2a2d3e')+'">'+
    '<div class="fbw" style="margin-bottom:14px">'+
    '<div style="font-size:15px;font-weight:700">Claude API kulcs</div>'+
    '<div style="display:inline-flex;align-items:center;gap:5px;background:'+(S.claudeKey?'#0a3b1a':'#1a1d2e')+
    ';border:1px solid '+(S.claudeKey?'#4ade8033':'#2a2d3e')+';border-radius:20px;padding:4px 10px">'+
    '<div class="dot" style="background:'+(S.claudeKey?'#4ade80':'#4b5563')+'"></div>'+
    '<span style="font-size:11px;color:'+(S.claudeKey?'#4ade80':'#4b5563')+';font-weight:600">'+
    (S.claudeKey?'Aktív':'Nincs beállítva')+'</span></div></div>'+
    (S.claudeKey?'<div class="kmask">'+mk(S.claudeKey)+'</div>':'')+
    '<label class="lbl">'+(S.claudeKey?window.t('analyzer.key_update'):window.t('analyzer.key_add'))+'</label>'+
    '<div class="pwrap"><input id="st-key" class="inp imono" type="password" placeholder="sk-ant-api03-..." oninput="S.keyIn=this.value;S.keyMsg=null">'+
    '<button class="ptgl" onclick="pwt(\'st-key\',this)">&#128065;</button></div>'+
    (S.keyMsg==='ok'?'<div style="margin-top:8px;font-size:12px;color:#4ade80">'+window.t('analyzer.key_saved')+'</div>':'')+
    (S.keyMsg==='error'?'<div style="margin-top:8px;font-size:12px;color:#f87171">Érvénytelen kulcs.</div>':'')+
    '<button class="btn bfull bsm btn-p" style="margin-top:12px" onclick="saveKey()">'+
    (S.savingKey?window.t('analyzer.key_testing'):window.t('analyzer.key_save_btn'))+'</button>'+
    (S.claudeKey?'<button class="btn bfull btn-del bsm" style="margin-top:8px" onclick="delKey()">'+window.t('analyzer.key_del_btn')+'</button>':'')+
    '<div style="margin-top:12px;font-size:11px;color:#4b5563;text-align:center;line-height:1.5">'+
    'Csak a böngésződben tárolódik. '+window.t('analyzer.key_note')+'</div></div>';
}

function rApp(){
  var tabs='<div class="tabs">'+
    '<button '+tabSt('analyzer')+' onclick="S.tab=\'analyzer\';R()">'+window.t('analyzer.tab_analyzer')+'</button>'+
    '<button '+tabSt('history')+' onclick="S.tab=\'history\';R()">Előzmények ('+S.history.length+')</button>'+
    '<button '+tabSt('settings')+' onclick="S.tab=\'settings\';R()">'+window.t('analyzer.tab_settings')+'</button>'+
    '</div>';
  var content=S.tab==='analyzer'?rAnalyzer():S.tab==='history'?rHistory():rSettings();
  return rHdr()+tabs+'<div class="body">'+content+'</div>';
}

function pwt(id,btn){
  var el=document.getElementById(id);
  if(!el) return;
  el.type=(el.type==='password')?'text':'password';
  btn.innerHTML=(el.type==='password')?'&#128065;':'&#128584;';
}
</script>
</body>
</html>
