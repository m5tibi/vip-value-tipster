<script>
// Safety fallback
if(typeof window.t!=="function"){window.t=function(k,fb){return fb||k.split(".").pop();};window.getLang=function(){return"hu";};window.setLang=function(){};window.toggleLang=function(){};}
// ── Biztonságos localStorage ──────────────────────────────
var KS='vbt_ck', HS='vbt_ah3';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsRemove(k){try{localStorage.removeItem(k);}catch(e){}}

// ── Állapot ───────────────────────────────────────────────
var S={
  screen:'loading', tab:'analyzer',
  claudeKey:'', keyIn:'', savingKey:false, keyMsg:null,
  query:'', loading:false, result:null,
  history:[], expanded:null
};

function getExamples(){
  return window.getLang&&window.getLang()==='en' ? [
    'Brazil - Norway',
    'Belgium - Senegal; both teams to score + Over 2.5',
    'Brazil - Argentina; home win',

  ] : [
    'Brazília - Norvégia',

var EXAMPLES = getExamples();

// ── Segédfüggvények ───────────────────────────────────────
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function mk(k){return k.slice(0,14)+'................'+k.slice(-4);}

// Szerveroldali előzmény-azonosító: a Claude kulcs SHA-256 hash-e (kitalálhatatlan)
var uidCache={key:'',uid:''};
function withUid(cb){
  var k=S.claudeKey;
  if(!k||!window.crypto||!crypto.subtle) return;
  if(uidCache.key===k) return cb(uidCache.uid);
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(k)).then(function(buf){
    var hex=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    uidCache={key:k,uid:hex};
    cb(hex);
  }).catch(function(){});
}

function tabSt(name){
  var a=S.tab===name;
  return 'style="padding:8px 15px;font-size:13px;font-weight:600;border:none;'+
    'border-radius:8px 8px 0 0;cursor:pointer;'+
    'background:'+(a?'#1e2130':'transparent')+';'+
    'color:'+(a?'#a78bfa':'#6b7280')+'"';
}

// ── AI szöveg renderelő ───────────────────────────────────
function renderAI(text){
  if(!text) return '';
  // Régi (hosszú) elemzések fejlécei – az előzményekben még ilyenek is vannak
  var HEADS=['MECCS','HAZAI','VENDEG','H2H','SERULES','FOGADASI','KONTEXTUS','FORMA','ELOZMENYEK','ERTEKELES'];
  // Új, tömör formátum fejlécei: emojival kezdődő, kettősponttal záruló sor
  var EMOJI_HEAD=/^\s*(📈|🤝|🚑|🎯|🧐)/;
  var CONF=[['MAGAS','#4ade80'],['HIGH','#4ade80'],['KÖZEPES','#fbbf24'],['MEDIUM','#fbbf24'],['ALACSONY','#f87171'],['LOW','#f87171']];
  var lines=text.split('\n');
  var out='';
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line.trim()){out+='<div style="height:6px"></div>';continue;}
    if(/^[-=━]{3,}$/.test(line.trim())){continue;}               // elválasztó vonalak
    var safe=esc(line);
    var fmt=safe.replace(/\*\*([^*]+)\*\*/g,'<strong style="color:#e2e8f0">$1</strong>');
    // Címsor: "⚽️ Hazai – Vendég (sorozat)"
    if(/^\s*⚽/.test(line)){
      out+='<div style="font-size:16px;font-weight:800;color:#e2e8f0;margin:2px 0 10px">'+fmt+'</div>';
      continue;
    }
    var upper=line.toUpperCase(), isHead=EMOJI_HEAD.test(line) && line.trim().slice(-1)===':';
    // Régi fejléc csak nem behúzott, nem számozott sor lehet (az indoklásban is előfordul pl. "hazai")
    if(!isHead && !EMOJI_HEAD.test(line) && !/^\s/.test(line) && !/^\d+\.\s/.test(line)){
      for(var j=0;j<HEADS.length;j++){
        if(upper.indexOf(HEADS[j])!==-1 && line.trim().length<80 &&
          (line.indexOf(':')===line.length-1 || /^[^\w]/.test(line))){ isHead=true; break; }
      }
    }
    if(isHead){ out+='<div class="sec-hdr">'+fmt+'</div>'; continue; }
    // Tippsor: "1. … – Megbízhatóság: MAGAS" → kiemelt sor, színes megbízhatósággal
    if(/^\s*\d+\.\s/.test(line)){
      for(var c=0;c<CONF.length;c++){
        fmt=fmt.replace(new RegExp('(Megbízhatóság|Confidence):\\s*'+CONF[c][0],'i'),
          '$1: <span style="color:'+CONF[c][1]+';font-weight:800">'+CONF[c][0]+'</span>');
      }
      out+='<div style="margin:6px 0 2px;color:#e2e8f0;font-weight:600">'+fmt+'</div>';
      continue;
    }
    // Tipp indoklása (behúzott sor) halványabban
    if(/^\s{2,}\S/.test(line)){ out+='<div style="margin:0 0 6px 18px;color:#94a3b8">'+fmt+'</div>'; continue; }
    out+='<div style="margin-bottom:4px">'+fmt+'</div>';
  }
  return out;
}

// ── Verdikt kinyerése ─────────────────────────────────────
function getVerdict(ai){
  if(!ai) return null;
  var m=ai.match(/VERDIKT\s*:\s*([\u2705\u26A0\u274C][^\n\r]*)/);
  if(m) return m[1].trim();
  if(ai.indexOf('AJANLOTT')!==-1||ai.indexOf('AJÁNLOTT')!==-1) return '\u2705 AJÁNLOTT';
  if(ai.indexOf('BIZONYTALAN')!==-1) return '\u26A0\uFE0F BIZONYTALAN';
  if(ai.indexOf('NEM AJANLOTT')!==-1||ai.indexOf('NEM AJÁNLOTT')!==-1) return '\u274C NEM AJÁNLOTT';
  return null;
}

function verdictStyle(v){
  if(!v) return '';
  if(v.indexOf('\u2705')!==-1) return 'background:#4ade8018;border:2px solid #4ade8055;color:#4ade80';
  if(v.indexOf('\u274C')!==-1) return 'background:#f8717118;border:2px solid #f8717155;color:#f87171';
  return 'background:#fbbf2418;border:2px solid #fbbf2455;color:#fbbf24';
}

function stripVerdict(ai){
  return ai.replace(/\n*VERDIKT\s*:.*$/,'').trim();
}

// ── Render ────────────────────────────────────────────────
function R(){
  try{
    var howItWorks=
    '<div class="card" style="border-color:#1e2130;margin-bottom:14px">'+
    '<div style="font-size:13px;font-weight:700;color:#a78bfa;margin-bottom:10px">'+window.t('analyzer.how_title')+'</div>'+
    '<div style="font-size:13px;color:#6b7280;line-height:1.7">'+
    ''+window.t('analyzer.how_body')+'<br><br>'+
    '<strong style="color:#94a3b8">'+window.t('analyzer.how_format')+'</strong> '+window.t('analyzer.team_example')+' '+window.t('analyzer.how_option')+'<br>'+
    '<span style="color:#4b5563">'+window.t('analyzer.how_example')+'</span>'+
    '</div></div>';

    var html=S.screen==='loading'?'':S.screen==='locked'?rLocked():howItWorks+(S.screen==='onboarding'?rOnboard():rApp());
    document.getElementById('root').innerHTML=html;
  }catch(e){
    document.getElementById('root').innerHTML='<div style="padding:20px;color:#f87171">Hiba: '+esc(String(e))+'</div>';
  }
}

// ── localStorage sync ─────────────────────────────────────
function boot(){
  try{
    var k=lsGet(KS);
    var h=lsGet(HS);
    if(k) S.claudeKey=k;
    if(h) S.history=JSON.parse(h)||[];
  }catch(e){}
  // Az elemző előfizetői funkció: belépés + aktív előfizetés (vagy admin) kell hozzá
  fetch('/api/auth/me',{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      S.me=d||{};
      if(!S.me.hasAccess){ S.screen='locked'; R(); return; }
      S.screen=S.claudeKey?'app':'onboarding';
      R();
      if(S.claudeKey) syncHistory();
    })
    .catch(function(){ S.me={}; S.screen='locked'; R(); });
}

// Zárolt nézet: nem belépett vagy nem előfizető látogató
function rLocked(){
  var en=window.getLang&&window.getLang()==='en';
  var loggedIn=!!(S.me&&S.me.user);
  var title=loggedIn?(en?'Subscription required':'Előfizetés szükséges'):(en?'Sign in to use the analyzer':'Lépj be az elemző használatához');
  var body=en
    ?'The AI match analyzer is available to subscribers. It searches the web for form, injuries and head-to-head data, and gives a verdict on your bet.'
    :'Az AI meccselemző az előfizetők funkciója: webes kereséssel nézi meg a formát, a sérüléseket és az egymás elleni eredményeket, és véleményt mond a fogadásodról.';
  var btn=loggedIn
    ?'<a href="/elofizetes.html" style="display:inline-block;background:#7c3aed;color:#fff;font-weight:700;padding:11px 24px;border-radius:9px;text-decoration:none">'+(en?'Subscribe':'Előfizetek')+'</a>'
    :'<a href="/tippek.html?login=1&next=/analyzer.html" style="display:inline-block;background:#7c3aed;color:#fff;font-weight:700;padding:11px 24px;border-radius:9px;text-decoration:none">'+(en?'Sign in':'Belépés')+'</a>'+
     '<div style="margin-top:12px;font-size:13px;color:#6b7280">'+(en?'No subscription yet? ':'Még nincs előfizetésed? ')+'<a href="/elofizetes.html" style="color:#a78bfa;font-weight:700;text-decoration:none">'+(en?'See plans':'Előfizetés')+'</a></div>';
  return rHdr()+
    '<div class="card" style="border-color:#7c3aed44;text-align:center;padding:28px 20px">'+
    '<div style="font-size:34px;margin-bottom:8px">🔒</div>'+
    '<div style="font-size:17px;font-weight:700;margin-bottom:8px">'+title+'</div>'+
    '<div style="font-size:14px;color:#94a3b8;line-height:1.65;margin-bottom:18px">'+body+'</div>'+btn+'</div>';
}
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',boot);
else boot();

function syncHistory(){
  withUid(function(uid){
    fetch('/api/analyzer-history?uid='+uid)
      .then(function(r){return r.json();})
      .then(function(d){
        if(Array.isArray(d)&&d.length){
          S.history=d;
          lsSet(HS,JSON.stringify(d));
          R();
        } else if(S.history.length){
          // Átállás az új azonosítóra: a böngészőben tárolt előzményt egyszer feltöltjük
          fetch('/api/analyzer-history',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({uid:uid,entries:S.history})
          }).catch(function(){});
        }
      }).catch(function(){});
  });
}

function saveEntry(entry){
  withUid(function(uid){
    fetch('/api/analyzer-history',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({uid:uid,entry:entry})
    }).catch(function(){});
  });
}

function clearServerHistory(){
  withUid(function(uid){
    fetch('/api/analyzer-history?uid='+uid,{method:'DELETE'}).catch(function(){});
  });
}

// ── API kulcs ─────────────────────────────────────────────
function saveKey(){
  if(!S.keyIn.trim()){S.keyMsg='error';R();return;}
  S.savingKey=true;S.keyMsg=null;R();
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':S.keyIn,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:10,messages:[{role:'user',content:'Hi'}]})
  }).then(function(r){
    if(r.ok){
      lsSet(KS,S.keyIn);
      S.claudeKey=S.keyIn;
      S.keyIn='';
      S.savingKey=false;
      S.screen='app';
      R();
      syncHistory();
    } else {
      S.keyMsg='error';
      S.savingKey=false;
      R();
    }
  }).catch(function(){ S.keyMsg='error'; S.savingKey=false; R(); });
}

function delKey(){lsRemove(KS);S.claudeKey='';S.keyIn='';S.keyMsg=null;S.screen='onboarding';R();}

// ── Példa betöltése ───────────────────────────────────────

}

// ── Elemzés ───────────────────────────────────────────────
// Elemzésenként legfeljebb ennyi webes keresés (a Claude web_search eszköz max_uses beállítása)
var MAX_SEARCHES=5;

function analyze(){
  if(!S.claudeKey){alert(window.t('analyzer.no_key_alert'));return;}
  if(S.loading) return;
  var q=(S.query||'').trim();
  if(!q){alert(window.t('analyzer.no_match_alert'));return;}
  S.loading=true;S.result=null;R();

  // Háttér-kontextus: főoldali tippek lekérése (NEM jelenik meg az elemzésben)
  fetch('/api/tips').then(function(r){return r.json();}).catch(function(){return {valueTips:[],aiTips:[]};})
  .then(function(td){
    var allTips=(td.aiTips||[]);
    var hiddenCtx='';
    if(allTips.length){
      hiddenCtx='\n\n[BELSŐ HÁTTÉR-KONTEXTUS — NEM JELENIK MEG AZ ELEMZÉSBEN, NE HIVATKOZZ RÁ]\n'+
        'Az alábbi tippek más forrásból már ki lettek dolgozva erre a napra. Az elemzésedben SOHA ne utalj arra, hogy "más tipp", "főoldal", "rendszer" vagy bármilyen külső forrás ezeket ajánlja. Ezeket csak saját konzisztencia-ellenőrzésre használd — ha az elemzésed más következtetésre jut, azt a te saját adatelemzésed alapján tedd, hivatkozás nélkül.\n';
      for(var i=0;i<allTips.length;i++){
        var t=allTips[i];
        hiddenCtx+='- '+t.match+': '+t.market+' → '+t.pick+' @ '+t.odds+'\n';
      }
      hiddenCtx+='[/BELSŐ HÁTTÉR-KONTEXTUS]\n';
    }

    var isEN = window.getLang && window.getLang() === 'en';
    // Tömör, Telegram-poszt jellegű formátum (a megjelenítés az emojis fejlécekre épül)
    var prompt = isEN ? (
      'You are a professional football betting analyst writing for paying subscribers.\n\n'+
      'STYLE: Correct, professional English. Short and concrete: every claim backed by a number or fact. Never reference other sources.\n\n'+
      'IMPORTANT: If you cannot identify a football match, write exactly: NOT UNDERSTOOD: [explanation]\n\n'+
      'User request:\n"'+q+'"\n'+hiddenCtx+'\n\n'+
      'Use web search for real, current data. You have at most '+MAX_SEARCHES+' searches: plan them (e.g. recent form of both teams, head to head, injuries/suspensions, current odds), combine topics into one query where possible and do not repeat searches. Output ONLY the finished analysis (no intro, no "I searched…" sentences), in EXACTLY this format:\n\n'+
      '⚽️ [Home] – [Away] ([competition, round/group])\n\n'+
      '📈 Form:\n[2-3 short sentences on both teams: latest results, winning run, goals]\n\n'+
      '🤝 Head to head:\n[1-2 sentences: record, latest meeting]\n\n'+
      '🚑 Absentees:\n[1-2 sentences: key injured/suspended players on both sides]\n\n'+
      '🎯 Top tips:\n'+
      '1. [Market and pick] @ [current odds if you found it] – Confidence: HIGH/MEDIUM/LOW\n   [one sentence of reasoning with a number]\n'+
      '2. [...]\n(2-3 tips, strongest first)\n\n'+
      'If the request contains a specific bet, add after the tips:\n'+
      '🧐 Your bet:\n[the bet – 2-3 sentences of evaluation with numbers]\n'+
      'VERDIKT: AJANLOTT — [short reason]  (or VERDIKT: BIZONYTALAN — … / VERDIKT: NEM AJANLOTT — …)\n\n'+
      'Rules: no * or # formatting, no tables. Real, verified numbers only.'
    ) : (
      'Te egy profi labdarúgás-fogadási elemző vagy, aki fizetős előfizetőknek ír.\n\n'+
      'STÍLUS: Helyes, igényes magyar nyelv. Rövid és konkrét: minden állítás mögött szám vagy tény. Soha ne utalj más forrásra.\n\n'+
      'FONTOS: Ha nem tudsz labdarúgó-mérkőzést azonosítani, írd pontosan: NEM ÉRTEM: [magyarázat]\n\n'+
      'A felhasználó kérése:\n"'+q+'"\n'+hiddenCtx+'\n\n'+
      'Használj webes keresést a valós, aktuális adatokhoz. Legfeljebb '+MAX_SEARCHES+' keresésed van: tervezd meg őket (pl. a két csapat friss formája, egymás elleni eredmények, sérültek/eltiltottak, aktuális oddsok), ahol lehet, vonj össze több témát egy keresésbe, és ne ismételj keresést. KIZÁRÓLAG a kész elemzést írd ki (bevezető és „megkerestem…” jellegű mondatok nélkül), PONTOSAN ebben a formában:\n\n'+
      '⚽️ [Hazai] – [Vendég] ([sorozat, forduló/csoport])\n\n'+
      '📈 Forma:\n[2-3 rövid mondat mindkét csapatról: legutóbbi eredmények, sorozatok, gólok]\n\n'+
      '🤝 Egymás ellen:\n[1-2 mondat: mérleg, legutóbbi találkozó]\n\n'+
      '🚑 Hiányzók:\n[1-2 mondat: a két csapat sérült/eltiltott kulcsjátékosai]\n\n'+
      '🎯 Top tippek:\n'+
      '1. [Piac és tipp] @ [aktuális odds, ha megtaláltad] – Megbízhatóság: MAGAS/KÖZEPES/ALACSONY\n   [egy mondat indoklás, számmal]\n'+
      '2. [...]\n(2-3 tipp, a legerősebb elöl)\n\n'+
      'Ha a kérés konkrét fogadást is tartalmaz, a tippek után írd:\n'+
      '🧐 A te fogadásod:\n[a fogadás – 2-3 mondat értékelés számokkal]\n'+
      'VERDIKT: AJANLOTT — [rövid ok]  (vagy VERDIKT: BIZONYTALAN — … / VERDIKT: NEM AJANLOTT — …)\n\n'+
      'Szabályok: ne használj csillag (*) vagy hashtag (#) formázást, se táblázatot. Csak valós, ellenőrzött számokat adj.'
    );

    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.claudeKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:6000,
        // Keresési limit: a költség nagy részét a keresési találatok szövege adja
        tools:[{type:'web_search_20250305',name:'web_search',max_uses:MAX_SEARCHES}],
        messages:[{role:'user',content:prompt}]
      })
    }).then(function(r){return r.json();})
    .then(function(d){
      // Csak az utolsó webes keresés utáni szöveg a kész elemzés; az előtte lévő szövegblokkok
      // a keresés közbeni megjegyzések ("Az adatok összegyűjtve…"), ezeket nem mutatjuk.
      var texts=[], blocks=d.content||[], lastTool=-1;
      for(var i=0;i<blocks.length;i++){ if(blocks[i].type!=='text') lastTool=i; }
      for(var j=lastTool+1;j<blocks.length;j++){ if(blocks[j].type==='text') texts.push(blocks[j].text); }
      if(!texts.length){ for(var k=0;k<blocks.length;k++){ if(blocks[k].type==='text') texts.push(blocks[k].text); } }
      var ai=texts.length?texts.map(function(s){return (s||'').trim();}).filter(Boolean).join('\n\n'):window.t('analyzer.analysis_failed');
      ai=ai.replace(/VERDIKT\s*:\s*AJANLOTT/gi,'VERDIKT: \u2705 AJÁNLOTT')
           .replace(/VERDIKT\s*:\s*NEM AJANLOTT/gi,'VERDIKT: \u274C NEM AJÁNLOTT')
           .replace(/VERDIKT\s*:\s*BIZONYTALAN/gi,'VERDIKT: \u26A0\uFE0F BIZONYTALAN')
           .replace(/VERDIKT\s*:\s*AJ\u00C1NLOTT/gi,'VERDIKT: \u2705 AJÁNLOTT')
           .replace(/VERDIKT\s*:\s*NEM AJ\u00C1NLOTT/gi,'VERDIKT: \u274C NEM AJÁNLOTT');
      var unclear=ai.indexOf('NEM ÉRTEM:')!==-1||ai.indexOf('NEM ERTEM:')!==-1;
      var entry={id:Date.now(),ts:new Date().toLocaleString('hu-HU'),query:q,ai:ai,unclear:unclear};
      S.result=entry;
      if(!unclear){
        S.history=[entry].concat(S.history).slice(0,50);
        lsSet(HS,JSON.stringify(S.history));
        saveEntry(entry);
      }
      S.loading=false;R();
    }).catch(function(e){
      S.result={error:true,msg:'Hiba: '+String(e)};
      S.loading=false;R();
    });
  });
}

function rAnalyzer(){
  var canGo=!!S.claudeKey&&!S.loading;
  var exBtns='';
  for(var i=0;i<EXAMPLES.length;i++){
    exBtns+='<button class="ex-btn" onclick="setEx('+i+')">'+esc(EXAMPLES[i])+'</button>';
  }
  var html=
    '<div class="card" style="border-color:#7c3aed33">'+
    '<label class="lbl">'+window.t('analyzer.match_label')+'</label>'+
    '<textarea id="qi" class="tarea" placeholder="'+window.t('analyzer.match_ph')+'" oninput="S.query=this.value">'+esc(S.query)+'</textarea>'+
    '<div style="margin-top:10px"><div style="font-size:11px;color:#4b5563;margin-bottom:6px">'+window.t('analyzer.examples_label')+'</div>'+exBtns+'</div>'+
    '</div>'+
    (!S.claudeKey?'<div class="card" style="border-color:#fbbf2433;color:#fbbf24;font-size:13px;text-align:center;margin-bottom:14px">'+
    'API kulcs hiányzik — add meg a '+window.t('analyzer.no_api_key')+'</div>':'')+
    '<button class="btn bfull '+(canGo?'btn-p':'btn-off')+'" onclick="analyze()">'+
    (S.loading?window.t('analyzer.analyzing'):window.t('analyzer.analyze_btn'))+'</button>'+
    '<div style="margin-top:8px;font-size:11px;color:#374151;text-align:center">'+
    window.t('analyzer.cost_note')+'</div>';

  if(S.result&&S.result.unclear){
    html+='<div class="card" style="margin-top:14px;border-color:#fbbf2433">'+
      '<div style="font-size:13px;font-weight:700;color:#fbbf24;margin-bottom:8px">Nem értem a kérést</div>'+
      '<div style="font-size:13px;color:#94a3b8;line-height:1.7">'+esc(S.result.ai.replace(/NEM \u00C9RTEM:/gi,'').replace(/NEM ERTEM:/gi,'').trim())+'</div>'+
      '</div>';
  }
  if(S.result&&!S.result.error&&!S.result.unclear){
    var r=S.result;
    var v=getVerdict(r.ai);
    var body=stripVerdict(r.ai);
    html+='<div class="card" style="margin-top:16px;border-color:#a78bfa33">'+
      '<div style="font-size:15px;font-weight:700;color:#e2e8f0;margin-bottom:4px">'+esc(r.query)+'</div>'+
      '<div style="font-size:12px;color:#6b7280;margin-bottom:14px">'+r.ts+'</div>'+
      '<div class="div">'+
      '<div style="font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">'+window.t('analyzer.ai_label')+'</div>'+
      '<div class="aitext">'+renderAI(body)+'</div>'+
      (v?'<div class="verdict-box" style="'+verdictStyle(v)+'">'+esc(v)+'</div>':'')+
      '<div style="margin-top:14px;font-size:12px;color:#6b7280">⚠️ '+(window.getLang&&window.getLang()==='en'
        ?'This analysis is for information only and is not betting advice. Please gamble responsibly.'
        :'Ez az elemzés tájékoztató jellegű, nem minősül fogadási tanácsnak. Felelősségteljesen játssz!')+'</div>'+
      '</div></div>';
  }
  if(S.result&&S.result.error){
    html+='<div class="card" style="margin-top:14px;border-color:#f8717133;color:#f87171;font-size:14px">'+
      esc(S.result.msg||'Hiba az elemzés során.')+'</div>';
  }
  return html;
}

function rHistory(){
  if(!S.history.length){
    return '<div style="text-align:center;color:#6b7280;padding:50px 20px;font-size:14px">'+window.t('analyzer.no_history')+'</div>';
  }
  var html='<button class="btn btn-del bsm" style="margin-bottom:14px" '+
    'onclick="if(confirm(\'Törölni az összes előzményt?\')){S.history=[];lsRemove(\''+HS+'\');clearServerHistory();R()}">'+
    'Előzmények törlése</button>';
  for(var i=0;i<S.history.length;i++){
    var h=S.history[i];
    var isExp=S.expanded===i;
    var v=getVerdict(h.ai||'');
    var title=h.query||(h.match?(h.match+(h.tip?' — '+h.tip:'')):'Elemzés');
    var vhtml=v?'<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;'+verdictStyle(v)+'">'+esc(v)+'</span>':'';
    html+='<div class="card" style="cursor:pointer;border-color:'+(isExp?'#a78bfa44':'#1e2130')+'" onclick="S.expanded=S.expanded==='+i+'?null:'+i+';R()">'+
      '<div class="fbw">'+
      '<div><div style="font-size:14px;font-weight:600;color:#e2e8f0">'+esc(title)+'</div>'+
      '<div style="font-size:12px;color:#6b7280;margin-top:2px">'+esc(h.ts||'')+'</div></div>'+
      vhtml+'</div>'+
      (isExp&&h.ai?'<div class="div" style="margin-top:10px"><div class="aitext" style="font-size:13px">'+renderAI(stripVerdict(h.ai))+'</div>'+
      (v?'<div class="verdict-box" style="margin-top:12px;'+verdictStyle(v)+'">'+esc(v)+'</div>':'')+
      '</div>':'')+
      '</div>';
  }
  return html;
}

function rApp(){
  var tabs='<div class="tabs">'+
    '<button '+tabSt('analyzer')+' onclick="S.tab=\'analyzer\';R()">'+window.t('analyzer.tab_analyzer')+'</button>'+
    '<button '+tabSt('history')+' onclick="S.tab=\'history\';R()">'+window.t('analyzer.tab_history')+'('+S.history.length+')</button>'+
    '<button '+tabSt('settings')+' onclick="S.tab=\'settings\';R()">'+window.t('analyzer.tab_settings')+'</button>'+
    '</div>';
  var content=S.tab==='analyzer'?rAnalyzer():S.tab==='history'?rHistory():rSettings();
  return rHdr()+tabs+'<div class="body">'+content+'</div>';
}

function pwt(id,btn){
  var el=document.getElementById(id);
  if(!el) return;
  el.type=(el.type==='password')?'text':'password';
  btn.innerHTML=(el.type==='password')?'&#128065;':'&#128584;';
}
